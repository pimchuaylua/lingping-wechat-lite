<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Session</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="config.js"></script>
    <script src="js/utils.js?v=20250210"></script>
    <link rel="stylesheet" href="assets/event-detail_style.css?v=20260529">
    <style>
        .section input.sub,
        .section textarea.sub {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            color: #111827;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.4;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .section input.sub:focus,
        .section textarea.sub:focus {
            outline: none;
            border-color: var(--theme);
            box-shadow: 0 0 0 3px rgba(255, 176, 80, 0.18);
        }

        .section input.sub[readonly] {
            background: #f9fafb;
            color: #6b7280;
            cursor: default;
        }

        .section textarea.sub {
            min-height: 110px;
            resize: vertical;
        }

        .hint mark {
            background: #FFF3B0;
            color: #78350f;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 600;
            font-style: normal;
        }

        .section select.sub {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            color: #111827;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.4;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .section select.sub:focus {
            outline: none;
            border-color: var(--theme);
            box-shadow: 0 0 0 3px rgba(255, 176, 80, 0.18);
        }
    </style>
</head>

<body>

    <div class="container" id="formContainer">Loading...</div>

    <div class="book-bar">
        <button class="book-btn" id="saveBtn" onclick="saveSession()">
            Save Changes
        </button>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('readingSessionId');
        const container = document.getElementById('formContainer');

        if (!sessionId) {
            container.innerHTML = '<p>No readingSessionId provided in URL.</p>';
        } else {
            loadSession();
        }

        async function loadSession() {
            try {
                const res = await fetch(`${BASE_URL}/reading-sessions/${sessionId}?locale=en_US`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': API_KEY
                    }
                });

                const json = await res.json();
                const s = json.data;

                if (!json.status || !s) {
                    container.innerHTML = '<p>Session not found.</p>';
                    return;
                }

                console.log('s', s)
                const en = s.translations?.en_US || {};
                const startTime = new Date(s.startTime);
                const dateVal = startTime.toISOString().slice(0, 10);
                const timeVal = startTime.toISOString().slice(11, 16);

                container.innerHTML = `
                    <div class="back-btn" onclick="history.back()">← Back</div>
                    <h1>Edit Session</h1>

                    <div class="section">
                        <div class="label">Title</div>
                        <div class="hint">Only change the <mark>"Topic TBD"</mark> part — keep the rest (e.g. language/level) as is.</div>
                        <input class="sub" id="title_en" value="${s.title || ''}">
                    </div>

                    <div class="section">
                        <div class="label">Description</div>
                        <div class="hint">Share briefly what we'll talk about! Example: "Share about your hometown — food, weather, childhood memories, and how it shaped you."
                        <br><br>Change only the <mark>📌 TBD</mark>. Keep the rest the same.</div>
                        <textarea class="sub" id="fullDescription_en">${s.fullDescription || ''}</textarea>
                    </div>


                    <div class="section">
                        <div class="label">Hosts</div>
                        <input class="sub" readonly value="${(s.hosts || []).map(h => h.profile?.displayName || h.displayName).join(', ')}">
                        <input type="hidden" id="hostIds" value="${(s.hosts || []).map(h => h._id || h).join(',')}">
                    </div>

                    <div class="section">
                        <div class="label">Date</div>
                        <input class="sub" readonly type="date" id="date" value="${dateVal}">
                    </div>
                    <div class="section">
                        <div class="label">Time Zone</div>

                        <select class="sub" id="timezone">
                            <option value="Asia/Bangkok">Bangkok (UTC+7)</option>
                            <option value="Asia/Shanghai">Shanghai (UTC+8)</option>
                            <option value="Asia/Tokyo">Tokyo (UTC+9)</option>
                            <option value="Asia/Seoul">Seoul (UTC+9)</option>
                            <option value="Asia/Singapore">Singapore (UTC+8)</option>
                            <option value="Europe/Berlin">Berlin</option>
                            <option value="America/Los_Angeles">Los Angeles</option>
                            <option value="America/New_York">New York</option>
                            <option value="UTC">UTC</option>
                        </select>
                    </div>

                    <div class="section">
                        <div class="label">Time</div>
                        <input class="sub" readonly type="time" id="time"
                            value="${utcTimeToTimezone(timeVal, 'Asia/Bangkok')}">
                    </div>

                    <div class="section">
                        <div class="label">Duration (mins)</div>
                        <input class="sub" readonly type="number" id="durationMins" value="${s.durationMins || ''}">
                    </div>

                    <div class="section">
                        <div class="label">Location</div>
                        <input class="sub" id="location_en" value="${s.location || ''}">
                    </div>
                    <div class="section">
                        <div class="label">Location Google Map URL</div>
                        <input class="sub" id="locationUrl" value="${s.locationUrl || ''}">
                    </div>

                    <div class="section">
                        <div class="label">Max Participants</div>
                        <input class="sub" type="number" id="maxParticipants" value="${s.maxParticipants || ''}">
                    </div>
                `;

                const timezoneEl = document.getElementById('timezone');
                const timeEl = document.getElementById('time');

                if (timezoneEl && timeEl) {
                    timezoneEl.addEventListener('change', function () {
                        timeEl.value = utcTimeToTimezone(timeVal, this.value);
                    });
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Failed to load session.</p>';
            }
        }

        function val(id) {
            return document.getElementById(id).value.trim();
        }

        function idList(id) {
            return val(id) ? val(id).split(',').map(x => x.trim()).filter(Boolean) : undefined;
        }

        async function saveSession() {
            const date = val('date');
            const time = val('time');
            const timezone = val('timezone');

            const startTime = date && time
                ? timezoneToUTC(date, time, timezone)
                : undefined;

            const body = {
                startTime,
                durationMins: Number(val('durationMins')) || undefined,
                locationUrl: val('locationUrl') || undefined,
                hostIds: idList('hostIds'),
                maxParticipants: Number(val('maxParticipants')) || undefined,
                translations: {
                    en_US: {
                        title: val('title_en'),
                        location: val('location_en'),
                        fullDescription: val('fullDescription_en'),
                    }
                }
            };

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const res = await fetch(`${BASE_URL}/reading-sessions/${sessionId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': API_KEY
                    },
                    body: JSON.stringify(body)
                });

                const json = await res.json();

                if (res.ok && json.status) {
                    alert('Session updated ✅');
                } else {
                    alert(json.message || 'Failed to update session.');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to update session.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        function utcTimeToTimezone(utcTime, timezone) {
            if (!utcTime) return '';

            const [hours, minutes] = utcTime.split(':').map(Number);

            const date = new Date();
            date.setUTCHours(hours, minutes, 0, 0);

            return new Intl.DateTimeFormat('en-GB', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).format(date);
        }

        function timezoneToUTC(dateValue, timeValue, timezone) {
            if (!dateValue || !timeValue) return null;

            // Create a date representing the selected local time.
            // Use a temporary UTC date, then calculate the timezone offset.
            const [year, month, day] = dateValue.split('-').map(Number);
            const [hours, minutes] = timeValue.split(':').map(Number);

            const guess = new Date(Date.UTC(year, month - 1, day, hours, minutes));

            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).formatToParts(guess);

            const get = (type) => Number(
                parts.find(p => p.type === type)?.value
            );

            const localAtGuess = Date.UTC(
                get('year'),
                get('month') - 1,
                get('day'),
                get('hour') === 24 ? 0 : get('hour'),
                get('minute')
            );

            const offset = localAtGuess - guess.getTime();

            return new Date(guess.getTime() - offset);
        }
    </script>

</body>

</html>
