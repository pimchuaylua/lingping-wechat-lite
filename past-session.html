<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Past Session | Lingping Club</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/png" href="assets/logos/favicon.png">

    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/feed_style.css?v=20261013">

    <script src="config.js"></script>
    <script src="js/translate.js?v=20260911"></script>
    <script src="js/translations.js?v=20261013"></script>
    <script src="js/utils.js?v=20250210"></script>

    <style>
        body {
            background: #F5F5F5;
        }

        .ps-header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            background: #F5F5F5;
            z-index: 10;
        }

        .ps-header-inner {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
            min-height: 52px;
            display: flex;
            align-items: center;
        }

        .ps-back {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            color: #B45309;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
        }

        .ps-body {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px 32px;
        }

        .ps-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 260px;
            border-radius: 16px;
            object-fit: cover;
            background: #DED6C6;
            display: block;
        }

        .ps-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 10px;
        }

        .ps-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
        }

        .ps-chip-joined {
            background: #D8F5E3;
            color: #1F7A3F;
        }

        .ps-chip-hosted {
            background: #E9D8FD;
            color: #6B21A8;
        }

        .ps-chip-location {
            background: #DCE9FF;
            color: #1E4E8C;
        }

        .ps-title {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.25;
            color: #222;
            margin: 4px 0 6px;
        }

        .ps-meta {
            font-size: 14px;
            color: #6B6B6B;
            margin-bottom: 14px;
        }

        .ps-attendees {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .ps-attendee-stack {
            display: flex;
        }

        .ps-attendee {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #F5F5F5;
            margin-left: -10px;
            background: #DDD;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #6B6B6B;
        }

        .ps-attendee:first-child {
            margin-left: 0;
        }

        .ps-attendees-text {
            font-size: 14px;
            color: #444;
        }

        .ps-details-link {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            font-size: 14px;
            font-weight: 600;
            color: #B45309;
            text-decoration: underline;
            margin-bottom: 12px;
        }

        .ps-posts-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            color: #222;
            margin: 8px 0 12px;
        }

        .ps-posts-count {
            font-size: 14px;
            font-weight: 600;
            color: #6B6B6B;
        }

        .ps-composer {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border-radius: 16px;
            padding: 10px 10px 10px 12px;
            margin-bottom: 12px;
            text-decoration: none;
        }

        .ps-composer-avatar {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #FDE9C8;
            color: #B45309;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            overflow: hidden;
        }

        .ps-composer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ps-composer-prompt {
            flex: 1;
            min-width: 0;
            color: #6B6B6B;
            font-size: 15px;
        }

        .ps-composer-postbtn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            min-height: 44px;
            background: #F4B462;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 0 18px;
            border-radius: 999px;
        }

        .ps-host-tag {
            display: inline-block;
            vertical-align: 2px;
            margin-left: 6px;
            background: #FDE9C8;
            color: #B45309;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .ps-empty {
            background: #fff;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            color: #6B6B6B;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="ps-header">
        <div class="ps-header-inner">
            <a href="past-sessions.html" class="ps-back" data-i18n="backToPastSessions">← Past sessions</a>
        </div>
    </div>

    <div class="ps-body" id="psBody">
        <div class="ps-empty" data-i18n="loading">Loading...</div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const userId = localStorage.getItem("userId");
        const sessionId = new URLSearchParams(window.location.search).get("sessionId");
        const body = document.getElementById("psBody");

        // t() returns the key itself when a translation is missing — fall back to English.
        function tr(key, fallback) {
            const text = window.t ? t(key) : key;
            return text && text !== key ? text : fallback;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function linkify(escapedText) {
            return escapedText.replace(
                /(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,
                (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
            );
        }

        function relativeTime(iso) {
            const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
            if (diffSec < 60) return "now";
            const diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) return `${diffMin}m`;
            const diffHr = Math.floor(diffMin / 60);
            if (diffHr < 24) return `${diffHr}h`;
            const diffDay = Math.floor(diffHr / 24);
            if (diffDay < 7) return `${diffDay}d`;
            return `${Math.floor(diffDay / 7)}w`;
        }

        const AVATAR_TINTS = ["#FDE9C8", "#DCE9FF", "#E9D8FD", "#D8F5E3", "#FFE0E0"];

        function initialAvatar(name) {
            const letter = (name || "?").trim().charAt(0).toUpperCase() || "?";
            return { letter, bg: AVATAR_TINTS[letter.charCodeAt(0) % AVATAR_TINTS.length] };
        }

        function cityFromLevel(level) {
            const parts = (level || "").split(":");
            return parts.length > 1 ? parts[1].trim() : "";
        }

        /* Same photo layout as the Feed tab (js/feed.js buildPhotosHtml).
           Tapping the card opens the post, which has the full photo viewer. */
        function buildPhotosHtml(photoUrls) {
            if (!photoUrls || !photoUrls.length) return "";
            if (photoUrls.length === 1) {
                return `<div class="feed-photo-single"><img src="${escapeHtml(photoUrls[0])}" loading="lazy"></div>`;
            }
            const shown = photoUrls.slice(0, 4);
            const extra = photoUrls.length - shown.length;
            return `<div class="feed-photo-grid feed-photo-grid-${shown.length}">
                ${shown.map((url, i) => `
                    <div class="feed-photo-tile">
                        <img src="${escapeHtml(url)}" loading="lazy">
                        ${(i === shown.length - 1 && extra > 0) ? `<div class="feed-photo-more">+${extra}</div>` : ""}
                    </div>
                `).join("")}
            </div>`;
        }

        function buildPostCard(post, isOnlineSession) {
            const author = post.author || {};
            const avatar = initialAvatar(author.displayName);
            const name = escapeHtml(author.displayName || "Lingping member");
            const hostTag = post.isHost ? `<span class="ps-host-tag">${escapeHtml(tr("hostTag", "HOST"))}</span>` : "";
            // Online sessions bring people together from everywhere — show where each poster was.
            const city = isOnlineSession ? (post.city || "").trim() : "";
            const authorLine = city
                ? `<div class="feed-author feed-author-with-place">${name} <span class="feed-author-at">${escapeHtml(tr("isIn", "is in"))}</span> <span class="feed-author-place">${escapeHtml(city)}</span>${hostTag}</div>`
                : `<div class="feed-author feed-author-with-place">${name}${hostTag}</div>`;

            return `
                <div class="feed-card" data-post-id="${escapeHtml(post._id)}">
                    <div class="feed-card-header">
                        <a class="feed-avatar-link" href="view-profile.html?userId=${encodeURIComponent(author._id || "")}" onclick="event.stopPropagation()">
                            ${author.profilePic
                                ? `<img class="feed-avatar" src="${escapeHtml(author.profilePic)}" alt="${name}">`
                                : `<div class="feed-avatar feed-avatar-initial" style="background:${avatar.bg}">${avatar.letter}</div>`
                            }
                        </a>
                        <div class="feed-card-headertext">
                            ${authorLine}
                            <div class="feed-meta">${relativeTime(post.createdAt)}</div>
                        </div>
                    </div>
                    <div class="feed-body feed-body-clamped">${linkify(escapeHtml(post.thoughts || ""))}</div>
                    <button type="button" class="feed-more-btn" hidden>${escapeHtml(tr("more", "More"))}</button>
                    ${buildPhotosHtml(post.photoUrls)}
                </div>
            `;
        }

        function attendeeAvatarHtml(a) {
            if (a.profilePic) return `<img class="ps-attendee" src="${escapeHtml(a.profilePic)}" alt="">`;
            const avatar = initialAvatar(a.name);
            return `<span class="ps-attendee" style="background:${avatar.bg}">${escapeHtml(avatar.letter)}</span>`;
        }

        async function fetchJson(path) {
            const res = await fetch(`${BASE_URL}${path}`, { headers: { "X-API-KEY": API_KEY } });
            if (!res.ok) throw new Error(`${path} → ${res.status}`);
            return (await res.json())?.data;
        }

        async function loadPastSession() {
            if (!sessionId) {
                body.innerHTML = `<div class="ps-empty">${escapeHtml(tr("sessionNotFound", "This session could not be found."))}</div>`;
                return;
            }

            try {
                const [s, attendeesData, postsData] = await Promise.all([
                    fetchJson(`/reading-sessions/${encodeURIComponent(sessionId)}?locale=en_US`),
                    fetchJson(`/reading-sessions/${encodeURIComponent(sessionId)}/attendees`).catch(() => []),
                    fetchJson(`/reading-sessions/${encodeURIComponent(sessionId)}/posts`).catch(() => [])
                ]);
                if (!s) throw new Error("Session not found");

                const attendees = Array.isArray(attendeesData) ? attendeesData : [];
                const posts = Array.isArray(postsData) ? postsData : [];

                const hostIds = (s.hosts || []).map(h => h._id || h);
                const hostNames = (s.hosts || []).map(h => h.displayName).filter(Boolean).join(", ") || tr("hostTBA", "TBA");
                const isHosting = !!userId && hostIds.includes(userId);
                const isAttending = !!userId && attendees.some(a => a.userId === userId);
                const isOnline = s.type === "online" || (s.level || "").toLowerCase().includes("online");
                const city = cityFromLevel(s.level) || s.location || "";
                const start = new Date(s.startTime);
                const end = new Date(start.getTime() + (s.durationMins || 60) * 60000);

                const roleChip = isHosting
                    ? `<span class="ps-chip ps-chip-hosted">✓ ${escapeHtml(tr("youHosted", "You hosted"))}</span>`
                    : isAttending
                        ? `<span class="ps-chip ps-chip-joined">✓ ${escapeHtml(tr("youJoined", "You joined"))}</span>`
                        : "";
                const placeChip = isOnline
                    ? `<span class="ps-chip ps-chip-location">🌐 ${escapeHtml(tr("tabOnline", "Online"))}</span>`
                    : (city ? `<span class="ps-chip ps-chip-location">📍 ${escapeHtml(city)}</span>` : "");

                const others = attendees.filter(a => a.userId !== userId).length;
                const attendeesText = isAttending
                    ? tr("youPlusOthersJoined", "You + {n} others joined").replace("{n}", others)
                    : tr("nJoined", "{n} joined").replace("{n}", attendees.length);

                body.innerHTML = `
                    <img class="ps-cover" src="${escapeHtml(s.photoUrl || "assets/logos/lingping_logo.png")}" alt="">

                    <div class="ps-chips">${roleChip}${placeChip}</div>

                    <div class="ps-title">${escapeHtml(s.title || "")}</div>
                    <div class="ps-meta">${escapeHtml(`${Utils.formatDate(start)} · ${Utils.formatTime(start)}–${Utils.formatTime(end)} (${Utils.getTimeZoneName()}) · ${tr("withHost", "with")} ${hostNames}`)}</div>

                    ${attendees.length ? `
                        <div class="ps-attendees">
                            <div class="ps-attendee-stack">${attendees.slice(0, 5).map(attendeeAvatarHtml).join("")}</div>
                            <span class="ps-attendees-text">${escapeHtml(attendeesText)}</span>
                        </div>
                    ` : ""}

                    <a class="ps-details-link" href="event-detail.html?sessionId=${encodeURIComponent(sessionId)}">${escapeHtml(tr("viewFullEventDetails", "View full event details"))}</a>

                    <div class="ps-posts-heading">
                        <span>${escapeHtml(tr("postsFromThisSession", "Posts from this session"))}</span>
                        <span class="ps-posts-count">${posts.length}</span>
                    </div>

                    <a class="ps-composer" href="share-to-feed.html?sessionId=${encodeURIComponent(sessionId)}">
                        <span class="ps-composer-avatar" id="psComposerAvatar"></span>
                        <span class="ps-composer-prompt">${escapeHtml(tr("whatDidYouLearn", "What did you learn tonight?"))}</span>
                        <span class="ps-composer-postbtn">${escapeHtml(tr("post", "Post"))}</span>
                    </a>

                    <div id="psPostsList">
                        ${posts.length
                            ? posts.map(p => buildPostCard(p, isOnline)).join("")
                            : `<div class="ps-empty">${escapeHtml(tr("noPostsYetBeFirst", "No posts yet — be the first to share what you learned."))}</div>`
                        }
                    </div>
                `;

                if (typeof applyTranslations === "function") applyTranslations(body);
                wirePostCards(posts);
                renderComposerAvatar();
            } catch (err) {
                console.error("Failed to load past session:", err);
                body.innerHTML = `<div class="ps-empty">${escapeHtml(tr("sessionLoadError", "Couldn't load this session."))}</div>`;
            }
        }

        function wirePostCards(posts) {
            const list = document.getElementById("psPostsList");

            // Same 5-line clamp as the Feed tab — only show "More" when text overflows.
            list.querySelectorAll(".feed-body-clamped").forEach(bodyEl => {
                if (bodyEl.scrollHeight > bodyEl.clientHeight + 1) bodyEl.nextElementSibling.hidden = false;
            });

            list.querySelectorAll(".feed-card").forEach(card => {
                card.addEventListener("click", (e) => {
                    if (e.target.closest("a")) return;
                    if (e.target.closest(".feed-more-btn")) {
                        card.querySelector(".feed-body").classList.remove("feed-body-clamped");
                        e.target.closest(".feed-more-btn").hidden = true;
                        return;
                    }
                    const post = posts.find(p => p._id === card.getAttribute("data-post-id"));
                    if (!post) return;
                    localStorage.setItem("selectedFeedPost", JSON.stringify(post));
                    window.location.href = `feed-detail.html?postId=${encodeURIComponent(post._id)}`;
                });
            });
        }

        async function renderComposerAvatar() {
            const el = document.getElementById("psComposerAvatar");
            if (!el) return;

            const avatar = initialAvatar(localStorage.getItem("username"));
            el.textContent = avatar.letter;
            el.style.background = avatar.bg;

            if (!userId) return;
            try {
                const profile = await fetchJson(`/users/${encodeURIComponent(userId)}/profile`);
                if (profile?.profilePic) {
                    el.innerHTML = `<img src="${escapeHtml(profile.profilePic)}" alt="">`;
                }
            } catch (err) {
                // keep the initial
            }
        }

        loadPastSession();
    </script>
</body>

</html>
