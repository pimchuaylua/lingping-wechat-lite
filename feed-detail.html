<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Feed | Lingping Club</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/png" href="assets/logos/favicon.png">

    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/feed_style.css?v=20261013">

    <script src="config.js"></script>
    <script src="js/translate.js?v=20260911"></script>
    <script src="js/translations.js?v=20261014"></script>
</head>

<body>
    <div class="feed-detail-header">
        <button class="feed-detail-back" onclick="goBack()" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div class="feed-detail-title" data-i18n="tabFeed">Feed</div>
        <button class="feed-share-btn" id="feedDetailShareBtn" aria-label="Share" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
        </button>
    </div>

    <div class="feed-detail-body" id="feedDetailBody"></div>

    <div class="feed-viewer" id="feedPhotoViewer" hidden>
        <button class="feed-viewer-close" onclick="closePhotoViewer()" aria-label="Close">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div class="feed-viewer-track" id="feedViewerTrack"></div>
    </div>

    <script>
        // Opened from a shared link (no previous page on this site) → go home instead.
        function goBack() {
            let cameFromSite = false;
            try {
                cameFromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
            } catch (err) {
                cameFromSite = false;
            }

            if (cameFromSite && history.length > 1) {
                history.back();
            } else {
                location.href = "index.html";
            }
        }
    </script>
    <script src="js/feed-share.js?v=20261012"></script>
    <script src="js/feed-detail.js?v=20261013"></script>
</body>

</html>
