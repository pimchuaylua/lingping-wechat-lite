<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>My Plan | Lingping Club</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/language_levels.css">

    <!-- Config & Logic -->
    <script src="config.js"></script>
    <script src="js/dropdown.js?v=20260516"></script>
    <script src="js/auth.js?v=20260312"></script>
    <script src="js/utils.js?v=20250210"></script>

    <style>
        .subscription-card {
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 6px solid;
            background: #fff;
        }

        .subscription-card.active {
            border-color: #4CAF50;
            background: #f6fff7;
        }

        .subscription-card.inactive {
            border-color: #ccc;
            background: #fafafa;
            opacity: 0.7;
        }

        .sub-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .sub-meta {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .sub-expire {
            margin-top: 6px;
            font-size: 13px;
            color: #777;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 6px;
        }

        .badge.active {
            background: #4CAF50;
            color: #fff;
        }

        .badge.inactive {
            background: #999;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="header"></div>

        <!-- 👋 User Welcome -->
        <div id="userWelcome" class="user-welcome"></div>
        <div id="learningBadge" class="learning-badge"></div>

        <!-- 🔹 Subscription List -->
        <div id="subscriptionList"></div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const listEl = document.getElementById("subscriptionList");

        /* ---------------- LOGIN ---------------- */

        function goToLogin() {
            const returnUrl = encodeURIComponent(window.location.href);
            window.location.href = `/login.html?returnUrl=${returnUrl}`;
        }

        function logout() {
            localStorage.removeItem("userId");
            localStorage.removeItem("username");
            location.reload();
        }

        /* ---------------- USER WELCOME ---------------- */

        function renderUserWelcome() {
            const username = localStorage.getItem("username");
            const el = document.getElementById("userWelcome");

            if (!el) return;

            if (username) {
                el.innerHTML = `
                    👋 Hello <strong>${username}</strong>!
                    <span class="logout" onclick="logout()">Logout</span>
                `;
            } else {
                el.innerHTML = `
                    <button class="login-btn" onclick="goToLogin()">Log in</button>
                `;
            }
        }

        /* ---------------- LOAD SUBSCRIPTIONS ---------------- */

        async function loadSubscriptions() {
            const userId = localStorage.getItem("userId");

            if (!userId) {
                listEl.innerHTML = `<div class="empty">Please log in to see your subscriptions.</div>`;
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/subscriptions/user/${userId}`, {
                    headers: {
                        "Content-Type": "application/json",
                        "x-api-key": API_KEY
                    }
                });

                const json = await res.json();
                const subs = json.data || [];

                if (!subs.length) {
                    listEl.innerHTML = `<div class="empty">You have no subscriptions.</div>`;
                    return;
                }

                // Sort by expiredAt DESC
                subs.sort((a, b) => {
                    if (a.expiredAt === null && b.expiredAt === null) return 0;
                    if (a.expiredAt === null) return 1;
                    if (b.expiredAt === null) return -1;

                    return new Date(b.expiredAt) - new Date(a.expiredAt);
                });
                console.log(subs);
                renderSubscriptions(subs);

            } catch (err) {
                listEl.innerHTML = `<div class="empty">Failed to load subscriptions.</div>`;
            }
        }

        async function loadUserProfile() {
            const userId = localStorage.getItem("userId");
            if (!userId) return;

            try {
                const res = await fetch(`${BASE_URL}/users/${userId}`, {
                    headers: {
                        "Content-Type": "application/json",
                        "x-api-key": API_KEY
                    }
                });

                const json = await res.json();
                const user = json.data;
                renderLearningBadge(user);

            } catch (err) {
                console.error("Failed to load user");
            }
        }

        /* ---------------- RENDER ---------------- */

        function renderLearningBadge(user) {
            const el = document.getElementById("learningBadge");
            if (!el) return;

            if (!user.learningLanguageCode || !user.languageLevel) {
                el.innerHTML = "";
                return;
            }

            const languageMap = {
                TH: "🇹🇭 Thai",
                ZH: "🇨🇳 Chinese",
                EN: "🇬🇧 English",
                JP: "🇯🇵 Japanese"
            };

            const language = languageMap[user.learningLanguageCode] || user.learningLanguageCode;
            const level = user.languageLevel;

            el.innerHTML = `
        <div class="learning-card level-${level}">

            <div class="learning-content">
                <div class="learning-label">LEARNING</div>
                <div class="learning-main">
                    ${language} · ${capitalize(level)}
                </div>
            </div>
        </div>
    `;
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function renderSubscriptions(subs) {
            listEl.innerHTML = "";
            const now = new Date();

            // 1️⃣ Enrich subscriptions with computed flags
            const enriched = subs.map(sub => {
                const expiredAtDate = sub.expiredAt ? new Date(sub.expiredAt) : null;
                const activatedAtDate = sub.activatedAt
                    ? new Date(sub.activatedAt)
                    : new Date(sub.createdAt);

                const levelName = sub.subscriptionPlan.name || "";
                const isCommunity = levelName.toLowerCase().includes("community");

                // Active if:
                // - Not yet activated (expiredAt === null), OR
                // - Not expired
                // AND still has passes (or unlimited)
                const isActive =
                    (expiredAtDate === null || expiredAtDate > now) &&
                    (sub.numberOfPassesLeft == null || sub.numberOfPassesLeft > 0);

                return {
                    ...sub,
                    expiredAtDate,
                    activatedAtDate,
                    isCommunity,
                    isActive
                };
            });

            // 2️⃣ Split active / inactive
            const activeSubs = enriched
                .filter(s => s.isActive)
                .sort((a, b) => {
                    if (!a.expiredAtDate && !b.expiredAtDate) return 0;
                    if (!a.expiredAtDate) return 1;  // null expiry goes last
                    if (!b.expiredAtDate) return -1;

                    return a.expiredAtDate - b.expiredAtDate; // earliest expiry first
                });

            const inactiveSubs = enriched
                .filter(s => !s.isActive)
                .sort((a, b) => {
                    if (!a.expiredAtDate && !b.expiredAtDate) return 0;
                    if (!a.expiredAtDate) return 1;
                    if (!b.expiredAtDate) return -1;
                    return b.expiredAtDate - a.expiredAtDate;
                });

            // 3️⃣ Render in order: active → inactive
            [...activeSubs, ...inactiveSubs].forEach(sub => {
                const card = document.createElement("div");
                card.className = `subscription-card ${sub.isActive ? "active" : "inactive"}`;

                const passesHtml = `<div>${sub.numberOfPassesLeft == null
                    ? "Unlimited access"
                    : `Passes Left: ${sub.numberOfPassesLeft}`
                    }</div>`

                card.innerHTML = `
                    <div class="sub-title">
                        ${sub.subscriptionPlan.name}
                        <span class="badge ${sub.isActive ? "active" : "inactive"}">
                            ${sub.isActive ? "Active" : "Expired/No Passes Left"}
                        </span>
                    </div>

                    <div class="sub-meta">
                        ${passesHtml}
                    </div>

                    <div class="sub-expire">
                        Valid through: ${sub.expiredAt
                        ? Utils.formatLastValidDay(sub.expiredAt)
                        : "Day of first use"
                    }
                    </div>

                    <div class="sub-expire">
                        Activated: ${sub.activatedAt === undefined
                        ? Utils.formatFullDate(sub.createdAt)
                        : sub.activatedAt === null
                            ? "Not activated yet"
                            : Utils.formatFullDate(sub.activatedAt)
                    }
                    </div> 
                `;

                listEl.appendChild(card);
            });
        }



        /* ---------------- INIT ---------------- */

        function init() {
            renderUserWelcome();
            loadUserProfile();
            loadSubscriptions();
        }

        init();
    </script>
</body>

</html>
