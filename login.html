<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Lingping Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/event-detail_style.css?v=20260303">
    <link rel="stylesheet" href="assets/subscription_main_style.css">
    <link rel="stylesheet" href="assets/login_style.css?v=20260310">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js"></script>
</head>

<body>

    <div id="browserPopup" class="browser-popup">
        <div class="browser-popup-card">
            <h3>Open in your browser</h3>
            <p>
                Google login may not work inside this app.<br><br>

                Please open this page in<br><br>

                <img src="assets/logos/safari.png" alt="Safari"
                    style="height:22px; width:auto; vertical-align:middle; margin-right:6px;">
                <b>Safari</b>
                &nbsp;or&nbsp;
                <img src="assets/logos/chrome.png" alt="Chrome"
                    style="height:22px; width:auto; vertical-align:middle; margin-right:6px;">
                <b>Chrome</b>.
            </p>

            <button onclick="copyLoginLink()">Copy Link</button>
            <button onclick="closeBrowserPopup()">Cancel</button>
        </div>
    </div>

    <div class="container" style="max-width:420px; margin-top:60px;">

        <div class="login-card">

            <h1 style="margin-bottom:5px;">Welcome Back 👋</h1>
            <div class="sub" style="margin-bottom:25px;">
                Continue to Lingping
            </div>

            <!-- Google Login -->
            <div id="g_id_onload"
                data-client_id="140719627174-5tt9d5rqmbjt48tplrh072j10uqkau8t.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>

            <div id="googleWrapper" style="position:relative; display:flex; justify-content:center; min-height:44px;">

                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline">
                </div>

                <div id="googleBlocker" onclick="showBrowserPopup()" style="
                        display:none;
                        position:absolute;
                        inset:0;
                        cursor:pointer;
                    ">
                </div>

            </div>

            <div class="login-divider">or</div>

            <!-- Username Login -->
            <div class="username-link" onclick="loginWithUsername()">
                Use a username instead
            </div>

        </div>

    </div>

</body>

<script>

    function isInAppBrowser() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        return (
            ua.includes("FBAN") ||
            ua.includes("FBAV") ||
            ua.includes("Instagram") ||
            ua.includes("Line") ||
            ua.includes("MicroMessenger")
        );
    }

    const { BASE_URL, API_KEY } = window.CONFIG;

    /* ---------------- REDIRECT HELPER ---------------- */

    function redirectBack() {
        const redirectTo =
            sessionStorage.getItem("redirectAfterLogin") ||
            document.referrer ||
            "/";

        sessionStorage.removeItem("redirectAfterLogin");
        window.location.href = redirectTo;
    }

    /* ---------------- GOOGLE LOGIN ---------------- */

    async function handleCredentialResponse(response) {
        try {
            const data = parseJwt(response.credential);

            const email = data.email;
            const displayName = data.name || email;

            let loginResult = await loginUser(email, "1234");

            if (!loginResult.success) {
                const registerResult = await registerUser(email, displayName);

                if (!registerResult.success) {
                    throw new Error("Registration failed");
                }

                loginResult = await loginUser(email, "1234");

                if (!loginResult.success) {
                    throw new Error("Login after registration failed");
                }
            }

            saveSession(loginResult.data, email);
            redirectBack();

        } catch (error) {
            console.error("Login flow error:", error);
            alert("Login failed. Please try again.");
        }
    }

    /* ---------------- USERNAME LOGIN ---------------- */

    async function loginWithUsername() {
        try {
            const username = prompt("Enter your username:")?.trim();
            if (!username) return;

            const loginResult = await loginUser(username, "lingpingreading33");

            if (!loginResult.success) {
                throw new Error("Invalid username. Please check and try again.");
            }

            saveSession(loginResult.data, username);
            redirectBack();

        } catch (err) {
            alert(err.message);
        }
    }

    /* ---------------- LOGIN API ---------------- */

    async function loginUser(username, password) {
        const res = await fetch(`${BASE_URL}/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-KEY": API_KEY
            },
            body: JSON.stringify({
                username,
                password
            })
        });

        const json = await res.json().catch(() => ({}));

        if (res.ok && json?.status && json?.data?.userId) {
            return { success: true, data: json.data };
        }

        return { success: false };
    }

    /* ---------------- REGISTER ---------------- */

    async function registerUser(email, displayName) {
        const res = await fetch(`${BASE_URL}/users`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-KEY": API_KEY
            },
            body: JSON.stringify({
                username: email,
                password: "1234",
                displayName,
                levelId: "675d52f5713aceb862a84a00",
                email
            })
        });

        if (res.ok) return { success: true };
        return { success: false };
    }

    /* ---------------- SESSION ---------------- */

    function saveSession(data, username) {
        localStorage.setItem("userId", data.userId);
        localStorage.setItem("username", username);
        localStorage.setItem("accessToken", data.access_token);
    }

    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
            atob(base64).split('').map(c =>
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join('')
        );
        return JSON.parse(jsonPayload);
    }

    function showBrowserPopup() {
        document.getElementById("browserPopup").style.display = "flex";
    }

    function closeBrowserPopup() {
        document.getElementById("browserPopup").style.display = "none";
    }

    function copyLoginLink() {
        const url = document.referrer || window.location.origin;
        navigator.clipboard.writeText(url);
        alert("Link copied! Open it in Safari or Chrome.");
    }

    window.addEventListener("load", () => {

        if (isInAppBrowser()) {
            document.getElementById("googleBlocker").style.display = "block";
        }

    });

</script>

</html>
