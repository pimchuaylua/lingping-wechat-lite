<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/logos/favicon.png">
    <meta charset="UTF-8" />
    <title>My Bookings | Lingping Club</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/style.css?v=20260530">

    <!-- Config & Logic -->
    <script src="config.js"></script>
    <script src="js/auth.js?v=20260312"></script>
    <script src="js/booking.js?v=202605162"></script>
    <script src="js/utils.js?v=20250210"></script>
    <script src="js/dropdown.js?v=20260516"></script>
    <script src="js/translate.js?v=20260911"></script>
    <script src="js/translations.js?v=20260911"></script>
    <script src="js/render-langague-level.js"></script>
    <link rel="stylesheet" href="assets/chip_style.css">
</head>

<body>
    <div class="container">
        <div id="header"></div>
        <h1 class="page-title" id="pageTitle">Upcoming Sessions</h1>
        <div id="eventList"></div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const eventList = document.getElementById("eventList");

        /* ---------------- USER WELCOME ---------------- */

        function renderUserWelcome() {
            const username = localStorage.getItem("username");
            const el = document.getElementById("userWelcome");
            if (!el) return;

            if (username) {
                el.innerHTML = `
                    👋 ${t("helloUser")} <strong>${username}</strong>!
                    <span class="logout" onclick="Auth.logout()">${t("logout")}</span>
                `;
            } else {
                el.innerHTML = `
                    <button class="login-btn" onclick="loginAndLoad()">${t("logIn")}</button>
                `;
            }
            Auth.renderNav();
        }

        async function loginAndLoad() {
            try {
                const username = prompt(t("enterUsernamePrompt"))?.trim();
                if (!username) return;

                await Auth.login(username);
                renderUserWelcome();

                const params = new URLSearchParams(window.location.search);
                const type = params.get("type") || "attending";
                loadMyEvents(type);
            } catch (err) {
                alert(err.message);
            }
        }

        /* ---------------- LOAD BOOKINGS ---------------- */

        async function loadMyEvents(type = "attending") {
            const userId = localStorage.getItem("userId");

            if (!userId) {
                eventList.innerHTML = `<div class="empty">${t("pleaseLogInBookings")}</div>`;
                return;
            }

            let sessions = [];

            const [eventOptions] = await Promise.all([
                loadSessionOptions(),
            ]);

            if (type === "attending") {
                const bookings = await getMyBookings();

                if (!bookings || !bookings.length) {
                    eventList.innerHTML = `<div class="empty">${t("noUpcomingBookings")}</div>`;
                    return;
                }
                sessions = mapBookingsToSessions(bookings, eventOptions);
            } else if (type === "hosting") {
                const hostingEvents = await getEventsToHost();
                if (!hostingEvents || !hostingEvents.length) {
                    eventList.innerHTML = `<div class="empty">${t("noUpcomingHosted")}</div>`;
                    return;
                }
                sessions = hostingEvents.map(s => formatReadingSessionToDisplay(s, eventOptions));
            }

            renderEvents(sessions);
        }

        /* ---------------- RENDER EVENTS ---------------- */

        function renderEvents(sessions) {
            eventList.innerHTML = "";



            sessions.forEach(s => {
                const card = document.createElement("div");
                card.className = "card";

                const hostObjects = s.hosts || [];
                const hosts = hostObjects.length
                    ? hostObjects.map(h => h.name).join(", ")
                    : t("hostTBA");

                const isCanceled = s.maxParticipants === -1;

                const isHosting =
                    new URLSearchParams(window.location.search).get("type") === "hosting";

                const hostHtml =
                    s.hosts?.length
                        ? `
                <div class="event-hosts">
                    <div class="host-avatars">
                        ${s.hosts.map(host => `
                            <img
                                src="${host.profile?.profilePic || 'assets/logos/lingping_logo.png'}"
                                class="host-avatar-small"
                                alt="${host.profile?.displayName || host.displayName}"
                                onclick="event.stopPropagation(); viewProfile('${host._id}')"
                            />
                        `).join("")}
                    </div>

                    <div class="host-names">
                        ${t("hostedBy")} ${s.hosts.map(host => `
                            <span
                                class="host-link"
                                onclick="event.stopPropagation(); viewProfile('${host._id}')"
                            >
                                ${host.profile?.displayName || host.displayName}
                            </span>
                        `).join(", ")}
                    </div>
                </div>`
                        : "";


                card.innerHTML = `
                <div class="event-card">
        ${s.photoUrl ? `
            <div class="event-photo">
                    <img class="event-img" src="${s.photoUrl}" alt="${s.title}">
                </div>
        ` : ""}

        <div class="event-body">
            <!-- Title + Status -->
            <div class="event-row">
                <div class="event-title">${s.title}</div>
                
                <div class="status ${s.maxParticipants === -1
                        ? "canceled"
                        : s.isFull
                            ? "full"
                            : "available"
                    }">
                    ${isCanceled
                        ? t("statusCanceled")
                        : s.isFull
                            ? t("statusFull")
                            : t("statusAvailable")
                    }
                </div>
            </div>

            ${renderLanguageChips(s.languages)}

            ${s.level.includes("Online")
                        ? `<div class="event-location">🌐 ${t("tabOnline")}</div>`
                        : s.locationUrl
                            ? `<div class="event-location">
                📍 <a href="${s.locationUrl}"
                     target="_blank"
                     rel="noopener"
                     onclick="event.stopPropagation()"
                   >${s.location || t("viewLocation")}</a>
           </div>`
                            : s.location
                                ? `<div class="event-location">📍 ${s.location}</div>`
                                : ""
                    }

            <div class="event-row">
                            <div class="event-time">
                    ${Utils.formatDate(s.date)} · ${s.startTime}
                </div>
                        </div>
            <div class="event-row">${hostHtml} </div>
            <div class="event-row">
    ${s.booked
                        ? `<div class="${isHosting ? "hosting-label" : "booked-label"}">
            ✓ ${isHosting ? t("hosting") : t("joining")}
        </div>
        ${isHosting
                            ? `<button class="edit-btn" onclick="event.stopPropagation(); location.href='edit-event.html?readingSessionId=${s.id}'">
                <svg class="edit-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 20h4L18.5 9.5a2.121 2.121 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 6l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                ${t("edit")}
            </button>`
                            : ""}`
                        : ""}
</div>
            </div>
        </div>
        </div class="event-card">
    `;

                card.onclick = () => {
                    localStorage.setItem("selectedSession", JSON.stringify(s));
                    window.location.href = "event-detail.html";
                };

                eventList.appendChild(card);
            });
        }

        /* ---------------- INIT ---------------- */

        function init() {
            renderUserWelcome();

            const params = new URLSearchParams(window.location.search);
            const type = params.get("type") || "attending";
            loadMyEvents(type);
        }

        init();
    </script>

    <script>
        const type = new URLSearchParams(window.location.search).get("type");

        document.getElementById("pageTitle").textContent =
            type === "hosting"
                ? t("eventsHosting")
                : t("eventsAttending");

        function viewProfile(userId) {
            if (userId) {
                window.location.href = `view-profile.html?userId=${encodeURIComponent(userId)}`;
            } else {
                window.location.href = "view-profile.html";
            }
        }
    </script>
</body>

</html>
