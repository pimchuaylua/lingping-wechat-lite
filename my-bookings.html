<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/logos/favicon.png">
    <meta charset="UTF-8" />
    <title>My Bookings | Lingping Club</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/style.css?v=20260530">

    <!-- Config & Logic -->
    <script src="config.js"></script>
    <script src="js/auth.js?v=20260312"></script>
    <script src="js/booking.js?v=20261007"></script>
    <script src="js/utils.js?v=20250210"></script>
    <script src="js/dropdown.js?v=20260516"></script>
    <script src="js/translate.js?v=20260911"></script>
    <script src="js/translations.js?v=20261007"></script>
    <script src="js/render-langague-level.js"></script>
    <link rel="stylesheet" href="assets/chip_style.css">
    <link rel="stylesheet" href="assets/policy-modal.css?v=20260525">
</head>

<body>
    <div class="container">
        <div id="header"></div>
        <h1 class="page-title" id="pageTitle">Upcoming Sessions</h1>
        <div id="eventList"></div>
    </div>

    <div id="cancelConfirmDialog" class="cancel-dialog-overlay" hidden onclick="if(event.target===this) closeCancelDialog()">
        <div class="cancel-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cancelDialogTitleEl">
            <div class="cancel-dialog-title" id="cancelDialogTitleEl" data-i18n="areYouSureCancel">Are you sure you want to cancel?</div>
            <div class="cancel-dialog-body" id="cancelDialogBody"></div>
            <div class="penalty-policy-box" id="cancelDialogPenaltyBox" hidden>
                <span class="penalty-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </span>
                <span id="cancelDialogPenaltyText"></span>
            </div>
            <div class="cancel-dialog-actions">
                <button type="button" class="cancel-dialog-btn cancel-dialog-btn-secondary" id="cancelDialogConfirmBtn"></button>
                <button type="button" class="cancel-dialog-btn cancel-dialog-btn-primary" id="cancelDialogKeepBtn" onclick="closeCancelDialog()" data-i18n="keepMySpot">Keep my spot</button>
            </div>
        </div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const userId = localStorage.getItem("userId");
        const eventList = document.getElementById("eventList");

        /* ---------------- USER WELCOME ---------------- */

        function renderUserWelcome() {
            const username = localStorage.getItem("username");
            const el = document.getElementById("userWelcome");
            if (!el) return;

            if (username) {
                el.innerHTML = `
                    👋 ${t("helloUser")} <strong>${username}</strong>!
                    <span class="logout" onclick="Auth.logout()">${t("logout")}</span>
                `;
            } else {
                el.innerHTML = `
                    <button class="login-btn" onclick="loginAndLoad()">${t("logIn")}</button>
                `;
            }
            Auth.renderNav();
        }

        async function loginAndLoad() {
            try {
                const username = prompt(t("enterUsernamePrompt"))?.trim();
                if (!username) return;

                await Auth.login(username);
                renderUserWelcome();

                const params = new URLSearchParams(window.location.search);
                const type = params.get("type") || "attending";
                loadMyEvents(type);
            } catch (err) {
                alert(err.message);
            }
        }

        /* ---------------- LOAD BOOKINGS ---------------- */

        async function loadMyEvents(type = "attending") {
            if (!userId) {
                eventList.innerHTML = `<div class="empty">${t("pleaseLogInBookings")}</div>`;
                return;
            }

            let sessions = [];

            const [eventOptions] = await Promise.all([
                loadSessionOptions(),
            ]);

            if (type === "attending") {
                const bookings = await getMyBookings();

                if (!bookings || !bookings.length) {
                    eventList.innerHTML = `<div class="empty">${t("noUpcomingBookings")}</div>`;
                    return;
                }
                sessions = mapBookingsToSessions(bookings, eventOptions);
            } else if (type === "hosting") {
                const hostingEvents = await getEventsToHost();
                if (!hostingEvents || !hostingEvents.length) {
                    eventList.innerHTML = `<div class="empty">${t("noUpcomingHosted")}</div>`;
                    return;
                }
                sessions = hostingEvents.map(s => formatReadingSessionToDisplay(s, eventOptions));
            } else if (type === "past") {
                // GET /users/{userId}/session-history?pastOnly=true — same
                // endpoint already used by share-to-feed.js's past-session
                // picker. Its session shape is much smaller than
                // formatReadingSessionToDisplay()'s (just _id/title/
                // startTime/level/location), so past sessions get their own
                // minimal card (renderPastEvents) instead of forcing them
                // through the full event-card template.
                const res = await fetch(`${BASE_URL}/users/${userId}/session-history?limit=20&offset=0&pastOnly=true`, {
                    headers: { "X-API-KEY": API_KEY }
                });
                const json = await res.json();
                const items = Array.isArray(json?.data?.sessions) ? json.data.sessions : [];

                if (!items.length) {
                    eventList.innerHTML = `<div class="empty">${t("noPastSessions")}</div>`;
                    return;
                }
                renderPastEvents(items);
                return;
            }

            renderEvents(sessions);
        }

        /* ---------------- RENDER PAST EVENTS (minimal card) ---------------- */

        function renderPastEvents(items) {
            eventList.innerHTML = "";

            items.forEach(item => {
                const sess = item.session;
                if (!sess) return;

                const card = document.createElement("div");
                card.className = "card";

                const isHost = (item.roles || []).includes("host");
                const roleLabel = isHost ? t("hosting") : t("joining");

                card.innerHTML = `
                    <div class="event-card">
                        <div class="event-body">
                            <div class="event-row">
                                <div class="event-title">${sess.title || ""}</div>
                            </div>
                            <div class="event-row">
                                <div class="event-time">${Utils.formatDate(new Date(sess.startTime))}</div>
                            </div>
                            <div class="event-row status-row">
                                <div class="${isHost ? "hosting-label" : "booked-label"}">✓ ${roleLabel}</div>
                            </div>
                        </div>
                    </div>
                `;

                card.onclick = () => {
                    window.location.href = `event-detail.html?sessionId=${encodeURIComponent(sess._id)}`;
                };

                eventList.appendChild(card);
            });
        }

        /* ---------------- RENDER EVENTS ---------------- */

        function renderEvents(sessions) {
            eventList.innerHTML = "";



            sessions.forEach(s => {
                const card = document.createElement("div");
                card.className = "card";
                card.id = `bookingCard_${s.id}`;

                const hostObjects = s.hosts || [];
                const hosts = hostObjects.length
                    ? hostObjects.map(h => h.name).join(", ")
                    : t("hostTBA");

                const isCanceled = s.maxParticipants === -1;

                const isHosting =
                    new URLSearchParams(window.location.search).get("type") === "hosting";

                const hostHtml =
                    s.hosts?.length
                        ? `
                <div class="event-hosts">
                    <div class="host-avatars">
                        ${s.hosts.map(host => `
                            <img
                                src="${host.profile?.profilePic || 'assets/logos/lingping_logo.png'}"
                                class="host-avatar-small"
                                alt="${host.profile?.displayName || host.displayName}"
                                onclick="event.stopPropagation(); viewProfile('${host._id}')"
                            />
                        `).join("")}
                    </div>

                    <div class="host-names">
                        ${t("hostedBy")} ${s.hosts.map(host => `
                            <span
                                class="host-link"
                                onclick="event.stopPropagation(); viewProfile('${host._id}')"
                            >
                                ${host.profile?.displayName || host.displayName}
                            </span>
                        `).join(", ")} ${t("hostedByEnd")}
                    </div>
                </div>`
                        : "";


                card.innerHTML = `
                <div class="event-card">
        ${s.photoUrl ? `
            <div class="event-photo">
                    <img class="event-img" src="${s.photoUrl}" alt="${s.title}">
                </div>
        ` : ""}

        <div class="event-body">
            <!-- Title + Status -->
            <div class="event-row">
                <div class="event-title">${s.title}</div>
                
                <div class="status ${s.maxParticipants === -1
                        ? "canceled"
                        : s.isFull
                            ? "full"
                            : "available"
                    }">
                    ${isCanceled
                        ? t("statusCanceled")
                        : s.isFull
                            ? t("statusFull")
                            : t("statusAvailable")
                    }
                </div>
            </div>

            ${renderLanguageChips(s.languages)}

            ${s.level.includes("Online")
                        ? `<div class="event-location">🌐 ${t("tabOnline")}</div>`
                        : s.locationUrl
                            ? `<div class="event-location">
                📍 <a href="${s.locationUrl}"
                     target="_blank"
                     rel="noopener"
                     onclick="event.stopPropagation()"
                   >${s.location || t("viewLocation")}</a>
           </div>`
                            : s.location
                                ? `<div class="event-location">📍 ${s.location}</div>`
                                : ""
                    }

            <div class="event-row">
                            <div class="event-time">
                    ${Utils.formatDate(s.date)} · ${s.startTime}
                </div>
                        </div>
            <div class="event-row">${hostHtml} </div>
            <div class="event-row status-row">
    ${s.booked
                        ? `<div class="${isHosting ? "hosting-label" : "booked-label"}">
            ✓ ${isHosting ? t("hosting") : t("joining")}
        </div>
        ${isHosting
                            ? `<button class="edit-btn" onclick="event.stopPropagation(); location.href='edit-event.html?readingSessionId=${s.id}'">
                <svg class="edit-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 20h4L18.5 9.5a2.121 2.121 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 6l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                ${t("edit")}
            </button>`
                            : ""}`
                        : ""}
</div>
            ${s.googleCalendarLink
                        ? `<div class="event-row gcal-row">
                <a class="gcal-btn" href="${s.googleCalendarLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
                    <svg class="gcal-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    ${t("addToGoogleCalendar")}
                </a>
            </div>`
                        : ""}
            ${s.booked && !isHosting
                        ? `<div class="event-row cancel-row">
                <span class="cancel-prompt-text">${t("cantMakeIt")}</span>
                <button type="button" class="cancel-link-btn" onclick="event.stopPropagation(); handleCancelFromList('${s.id}', '${s.startTimeISO}')">${t("cancelBookingLink")}</button>
            </div>`
                        : ""}
            </div>
        </div>
        </div class="event-card">
    `;

                card.onclick = () => {
                    localStorage.setItem("selectedSession", JSON.stringify(s));
                    window.location.href = "event-detail.html";
                };

                eventList.appendChild(card);
            });
        }

        /* ---------------- CANCEL FROM LIST ---------------- */

        function handleCancelFromList(sessionId, startTimeISO) {
            cancelBooking(sessionId, startTimeISO, () => {
                const card = document.getElementById(`bookingCard_${sessionId}`);
                if (card) card.remove();

                if (!eventList.children.length) {
                    eventList.innerHTML = `<div class="empty">${t("noUpcomingBookings")}</div>`;
                }
            });
        }

        /* ---------------- INIT ---------------- */

        function init() {
            renderUserWelcome();

            const params = new URLSearchParams(window.location.search);
            const type = params.get("type") || "attending";
            loadMyEvents(type);
        }

        init();
    </script>

    <script>
        const type = new URLSearchParams(window.location.search).get("type");

        const pageTitleText = type === "hosting"
            ? t("eventsHosting")
            : type === "past"
                ? "Past Sessions" // pending translation key — see proposed diff
                : t("eventsAttending");

        document.getElementById("pageTitle").textContent = pageTitleText;
        document.title = `${pageTitleText} | Lingping Club`;

        function viewProfile(userId) {
            if (userId) {
                window.location.href = `view-profile.html?userId=${encodeURIComponent(userId)}`;
            } else {
                window.location.href = "view-profile.html";
            }
        }
    </script>
</body>

</html>
