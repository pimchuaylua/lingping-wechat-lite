<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Session Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="config.js"></script>
    <script src="js/hosts.js?v=6"></script>
    <script src="js/booking.js?v=202602183"></script>
    <script src="js/utils.js?v=20250210"></script>
    <link rel="stylesheet" href="assets/event-detail_style.css?v=20260218">
    <link rel="stylesheet" href="assets/policy-modal.css">
</head>

<body>

    <div id="policyModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-text">
                ⚠️ <strong>重要提醒：请阅读取消政策</strong> 📌<br><br>
                如果您想取消课程，必须至少提前一天通知。<br>
                当天取消将扣除您的课程券。<br><br>

                ⚠️ <strong>PLEASE READ: CANCEL POLICY</strong> 📌<br><br>
                If you wish to cancel, you must do so at least 1 day before the class.<br>
                Cancelling on the day will result in your pass being deducted.
            </div>

            <div class="modal-actions">
                <button class="modal-cancel" onclick="closePolicyModal()">
                    No / 不同意
                </button>
                <button class="modal-confirm" onclick="confirmPolicy()">
                    Yes, I agree / 我同意
                </button>
            </div>
        </div>
    </div>
    <div class="container" id="sessionContainer">Loading...</div>

    <div class="book-bar">
        <button class="book-btn" onclick="event.stopPropagation(); handleBookClick(s.id,s.levelName)">
            Book Session
        </button>

        <button id="cancelBtn" class="cancel-btn" onclick="event.stopPropagation(); cancelBooking(s.id)"
            style="display:none;">
            Cancel Booking
        </button>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const container = document.getElementById("sessionContainer");
        const s = JSON.parse(localStorage.getItem("selectedSession"));
        const userId = localStorage.getItem("userId");
        const isOnline = s?.levelName?.toLowerCase().includes("online");

        //write function is onlineEnglishClass c
        function getMeetingNumber(levelName) {
            if (!levelName) return "395-0447-1911";

            if (levelName.toLowerCase().includes("english")) {
                return "818-0945-3603";
            }

            return "395-0447-1911";
        }

        if (!s) {
            container.innerHTML = "<p>Session not found.</p>";
        } else {
            const fullDescHTML = (s.fullDescription || s.description)
                .split("\n")
                .map(line => `<p>${line}</p>`)
                .join("");

            container.innerHTML = `
                <div class="back-btn" onclick="history.back()">← Back</div>
                <img class="event-photo" src="${s.photoUrl || 'https://via.placeholder.com/480x200'}">
                <h1>${s.title}</h1>

                <!-- Time -->
                <div class="section">
                    <div class="label">Time</div>
                    <div class="sub">
                        ${Utils.formatDate(s.date)} · ${s.time} (${Utils.getTimeZoneName()})
                    </div>
                </div>

                ${isOnline
                    ? `
                <!-- Meeting (Online only) -->
                <div class="section">
                    <div class="label">Join Online</div>

                    ${userId
                        ? `
                        <div class="sub" style="margin-top:10px;">

                            <!-- Platform Info -->
                            <div style="text-align:center; font-size:13px; color:#666; margin-bottom:8px;">
                                Tencent Meeting 腾讯会议 
                                <span 
                                    onclick="openMeetingInfo()" 
                                    style="cursor:pointer; color:#007bff; font-weight:bold;"
                                    title="Platform information"
                                >
                                    ⓘ
                                </span>
                            </div>

                            <!-- Join Button -->
                            <div
                                onclick="copyMeetingNumber('${getMeetingNumber(s?.levelName)}')"
                                style="
                                    background:#007bff;
                                    color:white;
                                    padding:14px;
                                    border-radius:8px;
                                    cursor:pointer;
                                    text-align:center;
                                    font-weight:bold;
                                    line-height:1.6;
                                "
                            >
                                ${getMeetingNumber(s?.levelName)} 📋
                            </div>
                        </div>

                            `
                        : `
                        <div class="sub">
                            Log in to see meeting details. New here? Add WeChat
                            <span class="highlight">lingpingreading</span>
                            to join your first session for free ✨
                        </div>
                            `
                    }
                </div>
                        `
                    : `
                <!-- Location (Offline only) -->
                <div class="section">
                    <div class="label">Location</div>
                    <div class="sub event-location">
                        ${s.locationUrl
                        ? `📍 <a href="${s.locationUrl}" target="_blank" rel="noopener">${s.location || "View location"}</a>`
                        : `📍 ${s.location || "Location TBA"}`
                    }
                    </div>
                </div>
                        `
                }

                <!-- Host -->
                <div class="section">
                    <div class="label">Host(s)</div>
                    <div id="hostsContainer"></div>
                </div>

                <!-- Description -->
                <div class="section">
                    <div class="label">About this session</div>
                    <div class="description">${fullDescHTML}</div>
                </div>

                <!-- Attendees -->
                <div id="attendeesSection" class="section">
                    <div class="label">Attendees</div>
                    <div class="sub">Loading...</div>
                </div>
            `;

            const hostsContainer = document.getElementById("hostsContainer");

            if (s.hostObjects && s.hostObjects.length) {
                hostsContainer.innerHTML = s.hostObjects.map(h => {
                    const extra = window.HOSTS_MAP?.[h._id] || {};
                    return `
                        <div class="host-card">
                            <img
                                src="${extra.photo || 'https://via.placeholder.com/72'}"
                                alt="${h.name}"
                                class="host-avatar"
                            />
                            <div class="host-info">
                                <div class="host-name">${h.name}</div>
                                ${extra.description ? `<div class="host-desc">${extra.description}</div>` : ""}
                            </div>
                        </div>
                    `;
                }).join("");
            } else {
                hostsContainer.innerHTML = `<div class="sub">TBA</div>`;
            }

            async function loadAttendees() {
                try {
                    const res = await fetch(`${BASE_URL}/reading-sessions/${s.id}/attendees`, {
                        headers: {
                            "Content-Type": "application/json",
                            "X-API-KEY": API_KEY
                        }
                    });

                    const json = await res.json();
                    const section = document.getElementById("attendeesSection");

                    if (json.status && json.data.length > 0) {
                        section.innerHTML = `
                            <div class="label">
                                Attendees (${s.maxParticipants - s.seatsLeft})
                            </div>
                            ${json.data.map(a => `
                                <div
                                    class="sub"
                                    style="cursor:pointer; color:#007bff;"
                                    onclick="viewProfile('${a.userId}')"
                                >
                                    • ${a.name}
                                </div>
                            `).join("")}
                        `;
                    } else {
                        section.innerHTML = `
                            <div class="label">Attendees</div>
                            <div class="sub">None yet</div>
                        `;
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById("attendeesSection").innerHTML =
                        `<div class="sub">Could not load attendees</div>`;
                }
            }

            loadAttendees();
        }

        function viewProfile(userId) {
            localStorage.setItem("viewUserId", userId);
            window.location.href = "view-profile.html";
        }

        function copyMeetingNumber(number) {
            if (!number) return;

            const tempInput = document.createElement("input");
            tempInput.value = number;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            alert("Meeting number copied ✅");
        }

    </script>

    <script>
        let pendingBooking = null;

        function showPolicyModal(sessionId) {
            pendingBooking = sessionId;
            document.getElementById('policyModal').classList.remove('hidden');
        }

        function closePolicyModal() {
            pendingBooking = null;
            document.getElementById('policyModal').classList.add('hidden');
        }

        function confirmPolicy() {
            if (pendingBooking) {
                bookSession({ sessionId: pendingBooking });
            }
            closePolicyModal();
        }
    </script>

    <script>

        if (userId) {
            document.getElementById("cancelBtn").style.display = "inline-block";
        }

        function handleBookClick(sessionId, levelName) {
            console.log('levelName', levelName);
            const isEnglish = levelName
                ? levelName.toLowerCase().includes('english')
                : false;
            if (isEnglish) {
                showPolicyModal(sessionId);
            } else {
                bookSession({ sessionId });
            }
        }

        function openMeetingInfo() {

            const modal = document.createElement("div");
            modal.className = "lp-modal-overlay";

            modal.innerHTML = `
    <div class="lp-modal-card">

        <div class="lp-modal-logo">
            <img src="photos/logos/voov_logo.png" alt="VooV Meeting Logo">
        </div>

        <div class="lp-modal-title">
            Tencent VooV Meeting
        </div>

        <div class="lp-modal-sub">
            Available on desktop and mobile.
        </div>

        <div class="lp-modal-body">
            Download 
            <a href="https://voovmeeting.com/download-center.html" target="_blank">
                here
            </a>.
        </div>

        <div class="lp-modal-btn">
            <button onclick="closeMeetingInfo()" class="book-btn" style="width:100%;">
                Close
            </button>
        </div>

    </div>
`;

            document.body.appendChild(modal);
        }

        function closeMeetingInfo() {
            document.querySelector(".lp-modal-overlay")?.remove();
        }
    </script>
</body>

</html>
