<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/logos/favicon.png">
    <meta charset="UTF-8">
    <title>View Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="config.js"></script>
    <link rel="stylesheet" href="assets/event-detail_style.css?v=20260529">
    <link rel="stylesheet" href="assets/view-profile_style.css">
    <link rel="stylesheet" href="assets/language-picker.css?v=202611093">
    <script src="js/translate.js?v=20260911"></script>
    <script src="js/translations.js?v=202611095"></script>
    <script src="js/language-picker.js?v=202611093"></script>
    <style>

    </style>
</head>

<body>
    <div class="container">
        <div class="back-btn" onclick="history.back()" data-i18n="backBtn">← Back</div>
        <div id="profileContent" data-i18n="vpLoading">Loading profile...</div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const container = document.getElementById("profileContent");

        const myUserId = localStorage.getItem("userId");
        const viewUserId = new URLSearchParams(window.location.search).get("userId");

        if (!viewUserId) {
            container.innerHTML = `<p>${t("vpUserNotFound")}</p>`;
        } else {
            loadProfile();
        }

        async function loadProfile() {
            try {

                const res = await fetch(`${BASE_URL}/users/${viewUserId}/profile`, {
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-KEY": API_KEY
                    }
                });

                if (res.status === 404) {
                    container.innerHTML = `
            <div class="profile-card">
                <h2>${t("vpNotAvailableTitle")}</h2>
                <p class="sub">${t("vpNotAvailableSub1")}</p>
                <p class="sub">${t("vpNotAvailableSub2")}</p>
            </div>`;
                    return;
                }

                const json = await res.json();
                const p = json.data;
                const pi = p.progressInfo || {}; // Fallback for safety

                // If they match (and you are logged in), it's your profile
                const isOwnProfile = !!myUserId && myUserId === viewUserId;

                // Safe avatar string to prevent inline onclick quote breaking
                const avatarSrc = p.profilePic || 'assets/logos/lingping_logo.png';

                // Determine if valid progress data exists
                const hasProgress = pi.host && pi.learn;

                container.innerHTML = `
            <div class="profile-card layout-wrapper">
                
                <!-- Top-Right Edit Button (Renders only on your own profile) -->
                ${isOwnProfile ? `
                    <a href="community-profile.html" class="edit-btn">
                        ✏️ ${t("edit")}
                    </a>
                ` : ''}

                <!-- LEFT COLUMN: Avatar & Gamification Stats -->
                <div class="left-col">
                    <div class="profile-header">
                        <img
                            src="${avatarSrc}"
                            onclick="openImageModal('${avatarSrc}')"
                        >
                        <h2>${p.displayName || p.user?.displayName || t('vpMember')}</h2>
                        
                        ${(pi.badges && pi.badges.length) ? `
                            <div class="badges-container">
                                ${pi.badges.map((badge, idx) => `
                                    <div class="user-badge badge-theme-${(idx % 3) + 1}">
                                        <svg class="badge-laurel-svg" viewBox="0 0 200 200">
                                            <defs>
                                                <g id="laurel-branch">
                                                    <path d="M 90 175 A 75 75 0 0 1 35 65" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
                                                    <path d="M 35 65 C 30 50 40 35 48 30 C 52 42 45 58 35 65 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 38 72 C 22 66 12 52 20 42 C 32 48 35 62 38 72 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 40 76 C 54 66 68 70 68 82 C 55 86 44 80 40 76 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 30 92 C 12 90 2 78 10 67 C 22 71 27 83 30 92 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 33 97 C 49 90 62 96 60 108 C 48 111 38 103 33 97 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 28 116 C 10 118 2 106 12 94 C 23 98 26 108 28 116 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 33 121 C 49 117 60 125 56 137 C 44 138 36 128 33 121 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 36 140 C 20 148 10 138 20 124 C 31 126 33 134 36 140 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 43 144 C 58 144 67 154 61 165 C 50 164 44 152 43 144 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 52 161 C 38 172 26 164 34 149 C 45 150 49 157 52 161 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 60 163 C 74 167 81 179 73 189 C 63 186 59 173 60 163 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                </g>
                                            </defs>
                                            <use href="#laurel-branch" />
                                            <use href="#laurel-branch" transform="translate(200, 0) scale(-1, 1)" />
                                        </svg>
                                        <span>${badge}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div id="languagesBlock" hidden></div>

                    ${hasProgress ? `
                    <div class="stats-container">
                        <!-- Host Progress -->
                        <div class="stat-group">
                            <div class="stat-title">🎙️ ${t("vpHostProgress")} <span>${t("vpPoints").replace("{n}", pi.host.currentPoints)}</span></div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${pi.host.progressPercentage}%"></div>
                            </div>
                            <div class="stat-detail">
                                <span>${t('vpLvl')} ${pi.host.level} • ${pi.host.badgeName || pi.host.badge || t('vpNoHosting')}</span>
                                <strong>${pi.host.currentPoints} / ${pi.host.maxPoints} ${t("vpPts")}</strong>
                            </div>
                        </div>

                        <!-- Learn Progress -->
                        <div class="stat-group">
                            <div class="stat-title">📚 ${t("vpLearnProgress")} <span>${t("vpPoints").replace("{n}", pi.learn.currentPoints)}</span></div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${pi.learn.progressPercentage}%"></div>
                            </div>
                            <div class="stat-detail">
                                <span>${t("vpLvl")} ${pi.learn.level} • ${pi.learn.badgeName || pi.learn.badge}</span>
                                <strong>${pi.learn.currentPoints} / ${pi.learn.maxPoints} ${t("vpPts")}</strong>
                            </div>
                        </div>

                        <!-- Metadata Rows -->
                        ${pi.membershipTenure ? `<div class="info-row">📅 ${pi.membershipTenure.displayText}</div>` : ''}
                    </div>
                    ` : ''}
                </div>

                <!-- RIGHT COLUMN: About & Fun Facts -->
                <div class="right-col">
                    ${p.description?.trim().length > 1 ? `
                        <div class="profile-section">
                            <div class="section-title">${t("vpAbout").replace("{name}", p.displayName)}</div>
                            ${renderDescription(p.description)}
                        </div>
                        ` : ""}

                    ${p.topicsOfInterests && p.topicsOfInterests.length ? `
                    <div class="profile-section">
                        <div class="section-title">${t("vpTopics")}</div>
                        <div>
                            ${p.topicsOfInterests.map(t => `<span class="topic">${t.name}</span>`).join("")}
                        </div>
                    </div>
                    ` : ""}

                    ${(p.funPrompts || []).filter(fp => fp.answer && fp.answer.trim()).length ? `
                    <div class="profile-section">
                        <div class="section-title">${t("vpFunFacts")}</div>
                        ${(p.funPrompts || []).filter(fp => fp.answer && fp.answer.trim()).map(fp => `
                            <div class="fun-prompt">
                                <strong>${fp.question}</strong>
                                <div class="fun-answer">${fp.answer}</div>
                            </div>
                        `).join("")}
                    </div>
                    ` : ""}
                </div>

            </div>

            <!-- Image Modal -->
            <div id="imageModal" class="image-modal" onclick="closeImageModal()">
                <span class="close-btn">&times;</span>
                <img id="modalImage" class="modal-image">
            </div>
        `;

                LanguagesBlock.mount(document.getElementById("languagesBlock"), {
                    userId: viewUserId,
                    languages: p.languages || [],
                    isOwn: isOwnProfile
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p>${t("vpFailed")}</p>`;
            }
        }

        // Modal scripts
        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImage').src = src;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        document.addEventListener('click', function (e) {
            if (e.target.id === 'modalImage') e.stopPropagation();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeImageModal();
        });

        function renderDescription(text) {
            if (!text || !text.trim()) return '';

            const words = text.trim().split(/\s+/);

            if (words.length <= 50) {
                return `<p class="profile-description">${text}</p>`;
            }

            const shortText = words.slice(0, 50).join(" ");

            // Clean text for safe inline HTML attribute passing
            const safeFull = encodeURIComponent(text);
            const safeShort = encodeURIComponent(shortText);

            return `
        <p class="profile-description"><span class="desc-content">${shortText}...</span><button type="button" class="desc-toggle-btn" onclick="toggleDescription(this, '${safeFull}', '${safeShort}')">${t("vpShowMore")} <span class="arrow">▼</span></button></p>
    `;
        }

        window.toggleDescription = function (btn, safeFull, safeShort) {
            const textSpan = btn.previousElementSibling;
            const isExpanded = btn.classList.contains("expanded");

            if (isExpanded) {
                textSpan.innerText = decodeURIComponent(safeShort) + "...";
                btn.innerHTML = `${t("vpShowMore")} <span class="arrow">▼</span>`;
                btn.classList.remove("expanded");
            } else {
                textSpan.innerText = decodeURIComponent(safeFull) + " ";
                btn.innerHTML = `${t("vpShowLess")} <span class="arrow">▲</span>`;
                btn.classList.add("expanded");
            }
        };
    </script>
</body>

</html>
