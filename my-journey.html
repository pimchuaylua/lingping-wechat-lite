<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>My Learning Journey | Lingping Club</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/style.css">

    <!-- Config & Logic -->
    <script src="config.js"></script>
    <script src="js/auth.js?v=20260312"></script>
    <script src="js/booking.js?v=202605162"></script>
    <script src="js/utils.js?v=20250210"></script>
    <script src="js/dropdown.js?v=20260516"></script>
</head>

<body>
    <div class="container">

        <div id="header"></div>

        <h1 class="page-title">My Learning Journey</h1>

        <div id="journeyList"></div>

    </div>

    <div id="learningPopup" class="learning-popup hidden">
        <div class="learning-popup-content">

            <div class="popup-title">Add Learning ✍️</div>

            <!-- Thoughts -->
            <div class="popup-section">
                <div class="label">Thoughts</div>
                <textarea id="thoughtsInput"
                    placeholder="Insights you learned, new culture, new perspectives, reflections, did someone change your mind?"></textarea>
            </div>

            <!-- Words -->
            <div class="popup-section">
                <div class="label">Words you learned</div>

                <input class="word-input" placeholder="satán = beach" />
                <input class="word-input" placeholder="admire = Chinese translation" />
                <input class="word-input" placeholder="好奇 = curious" />
            </div>

            <div class="popup-actions">
                <button class="discard-btn" onclick="closeLearningPopup()">
                    Discard
                </button>

                <button class="complete-btn" onclick="submitLearning()">
                    Complete
                </button>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    /* ---------------- MOCK DATA ---------------- */

    const { BASE_URL, API_KEY } = window.CONFIG;

    const journeyList = document.getElementById("journeyList");

    async function loadJourney() {
        try {
            const userId = localStorage.getItem("userId");
            const token = localStorage.getItem("token");

            const res = await fetch(
                `${BASE_URL}/bookings/history/user/${userId}`,
                {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-KEY": API_KEY,
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            const data = await res.json();
            const list = data.data;
            console.log(list);
            const myLearnings = list
                .map((item, index) => {
                    const session =
                        item.readingSession?.translations?.en_US || {};

                    const title = session.title || "Lingping Session";

                    const date = new Date(
                        item.readingSession.startTime
                    ).toLocaleDateString("en-US", {
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    });

                    const words =
                        item.learning?.wordsLearned?.join(", ") ||
                        "-";

                    const insights =
                        item.learning?.thoughts ||
                        "-";

                    return {
                        id: item._id || `j${index}`,
                        title,
                        date,
                        hasMemo: item.hasLearning,
                        words,
                        insights,
                        sessionId: item.readingSession._id
                    };
                });

            console.log(myLearnings);

            return myLearnings;

        } catch (err) {
            console.error("Failed to load journey:", err);
            return [];
        }
    }

    /* ---------------- MEMO STATE ---------------- */

    function getMemoState() {
        return JSON.parse(localStorage.getItem("journeyMemo") || "{}");
    }

    function toggleMemo(id) {
        const state = getMemoState();
        state[id] = !state[id];
        localStorage.setItem("journeyMemo", JSON.stringify(state));
        renderJourney();
    }

    /* ---------------- HELPERS ---------------- */

    function renderSection(label, value, type) {
        if (!value || value.trim() === "") return "";

        return `
            <div class="section section-${type}">
                <div class="section-label">${label}</div>
                <div class="section-value">${value}</div>
            </div>
        `;
    }

    /* ---------------- RENDER ---------------- */

    async function renderJourney() {
        const memoState = getMemoState();

        journeyList.innerHTML = "";

        const myLearnings = await loadJourney();

        myLearnings.forEach(item => {

            const card = document.createElement("div");
            card.className = "card";

            const hasMemo = memoState[item.id] ?? item.hasMemo;

            const contentHTML = `
        ${renderSection("Thoughts", item.insights, "thoughts")}
        ${renderSection("Words I'll Use", item.words, "words")}`;
            console.log(item);

            card.innerHTML = `
        <div class="card-header">

            <!-- Row 1: date + memo icon -->
            <div class="card-top">
                <div class="card-date">${item.date}</div>

                <div class="memo-icon ${hasMemo ? 'has-memo' : 'no-memo'}"
                    onclick="${hasMemo ? '' : `openLearningPopup('${item.sessionId}')`}">
                    ${hasMemo ? "✔️" : "➕"}
                </div>
            </div>

            <!-- Row 2: title -->
            <div class="card-main">
                <div class="card-title">${item.title}</div>
            </div>

        </div>

        ${contentHTML}
        `;

            journeyList.appendChild(card);
        });
    }

    /* ---------------- INIT ---------------- */

    renderJourney();

    let currentSessionId = null;

    function openLearningPopup(sessionId) {
        currentSessionId = sessionId;
        document.getElementById("learningPopup").classList.remove("hidden");
    }

    function closeLearningPopup() {
        document.getElementById("learningPopup").classList.add("hidden");
    }

    async function submitLearning() {
        const thoughts = document.getElementById("thoughtsInput").value;

        const wordInputs = document.querySelectorAll(".word-input");

        const wordsLearned = Array.from(wordInputs)
            .map(i => i.value.trim())
            .filter(Boolean);

        const userId = localStorage.getItem("userId");

        try {
            const res = await fetch(
                `${BASE_URL}/users/${userId}/learnings`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-KEY": window.CONFIG.API_KEY
                    },
                    body: JSON.stringify({
                        sessionId: currentSessionId,
                        wordsLearned,
                        thoughts
                    })
                }
            );

            if (!res.ok) throw new Error("Failed");

            closeLearningPopup();
            resetLearningForm(); // ✅ important

            alert("Yay! I learned new things today 🎉");
            renderJourney();

        } catch (err) {
            console.error(err);
            alert("Failed to save learning");
        }


    }

    function resetLearningForm() {
        document.getElementById("thoughtsInput").value = "";

        document.querySelectorAll(".word-input").forEach(input => {
            input.value = "";
        });

        function openLearningPopup(sessionId) {
            currentSessionId = sessionId;

            resetLearningForm(); // ✅ always start clean

            document.getElementById("learningPopup").classList.remove("hidden");
        }
    }

</script>
