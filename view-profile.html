<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/logos/lingping_logo.png">
    <meta charset="UTF-8">
    <title>View Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="config.js"></script>
    <link rel="stylesheet" href="assets/event-detail_style.css?v=20260529">
    <link rel="icon" type="image/png" href="assets/logos/lingping_logo.png">
    <style>
        :root {
            --theme: #FFB050;
        }

        .profile-section {
            margin-top: 28px;
        }

        .profile-pic {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            cursor: zoom-in;
            display: block;
        }

        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .image-modal.show {
            display: flex;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
        }

        body {
            background:
                linear-gradient(180deg,
                    rgba(255, 176, 80, 0.18),
                    #f5f5f5 220px);
        }

        /* Back button */
        .back-btn {
            margin-bottom: 14px;
            font-size: 14px;
            color: var(--theme);
            cursor: pointer;
            font-weight: 500;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* Profile card — soft, no borders */
        .profile-card {
            background: #fff;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
        }

        /* Header section */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 18px;
        }

        /* Avatar — bigger, clean */
        .profile-header img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
            margin-bottom: 14px;
        }

        /* Name */
        .profile-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }



        /* Short bio */
        .profile-header .sub {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
        }

        /* Description */
        .profile-card p {
            font-size: 14px;
            color: #444;
            line-height: 1.55;
        }

        /* Section titles */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }


        /* Topics — keep capsule style */
        .topic {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 176, 80, 0.22);
            color: #333;
            font-size: 13px;
            font-weight: 500;
            margin: 6px 6px 0 0;
            border: 1px solid rgba(255, 176, 80, 0.5);
        }

        .fun-prompt {
            background: #fff;
            border: 1px solid #eee;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .fun-prompt strong {
            font-weight: 600;
            color: #333;
        }

        .fun-answer {
            margin-top: 6px;
            white-space: pre-line;
        }

        .profile-description {
            padding: 0;
            background: transparent;
            border-radius: 0;
            color: #555;
            font-size: 15px;
            line-height: 1.7;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="back-btn" onclick="history.back()">← Back</div>
        <div id="profileContent">Loading profile...</div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const userId = localStorage.getItem("viewUserId");
        const container = document.getElementById("profileContent");

        if (!userId) {
            container.innerHTML = "<p>User not found.</p>";
        } else {
            loadProfile();
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${BASE_URL}/users/${userId}/profile`, {
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-KEY": API_KEY
                    }
                });

                // ✅ Handle no-profile case
                if (res.status === 404) {
                    container.innerHTML = `
                    <div class="profile-card">
                        <h2>Profile not available</h2>
                        <p class="sub">
                            This member hasn’t created a public profile yet.
                        </p>
                        <p class="sub">
                            You can still see them in sessions and activities 😊
                        </p>
                    </div>
                `;
                    return;
                }
                const json = await res.json();
                const p = json.data;

                container.innerHTML = `
                    <div class="profile-card">

                        <div class="profile-header">
                            <img
                                src="${p.profilePic || 'https://via.placeholder.com/140'}"
                                alt="${p.displayName}"
                                class="profile-pic"
                                onclick="openImageModal('${p.profilePic || 'https://via.placeholder.com/140'}')"
                            >

                            <h2>${p.displayName}</h2>
                            <div class="sub">${p.bio || ''}</div>
                        </div>

                        <!-- Image Modal -->
                        <div id="imageModal" class="image-modal" onclick="closeImageModal()">
                            <span class="close-btn">&times;</span>
                            <img id="modalImage" class="modal-image">
                        </div>

                        ${p.description && p.description.trim() ? `
                        <div class="profile-section">
                            <div class="section-title">More About Me</div>
                            <div class="profile-description">
                                ${p.description}
                            </div>
                        </div>
                    ` : ""}

                        ${p.topicsOfInterests && p.topicsOfInterests.length ? `
                            <div class="profile-section">
                                <div class="section-title">Topics of Interest</div>
                                <div>
                                    ${p.topicsOfInterests.map(t =>
                    `<span class="topic">${t.name}</span>`
                ).join("")}
                                </div>
                            </div>
                        ` : ""}

                        ${(p.funPrompts || []).filter(fp => fp.answer && fp.answer.trim()).length ? `
                            <div class="profile-section">
                                <div class="section-title">Fun Facts</div>

                                ${(p.funPrompts || [])
                            .filter(fp => fp.answer && fp.answer.trim())
                            .map(fp => `
                                        <div class="fun-prompt">
                                            <strong>${fp.question}</strong>
                                            <div class="fun-answer">${fp.answer}</div>
                                        </div>
                                    `).join("")}
                            </div>
                        ` : ""}

                    </div>

                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p>Failed to load profile.</p>";
            }
        }

        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImage');

            img.src = src;
            modal.classList.add('show');

            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        // Prevent closing when clicking the image itself
        document.getElementById('modalImage').addEventListener('click', function (e) {
            e.stopPropagation();
        });

        // Close with Escape
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });
    </script>
</body>

</html>
