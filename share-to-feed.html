<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Share to Feed | Lingping Club</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/png" href="assets/logos/favicon.png">

    <link rel="stylesheet" href="assets/mainpage_style.css?v=20260516">
    <link rel="stylesheet" href="assets/feed_style.css?v=20260929">

    <script src="config.js"></script>
    <script src="js/auth.js?v=20260312"></script>
    <script src="js/utils.js?v=20250210"></script>
    <script src="js/translate.js?v=20260911"></script>
    <script src="js/translations.js?v=20260911"></script>
</head>

<body>
    <div class="share-header">
        <button class="share-header-cancel" onclick="handleCancel()" data-i18n="cancel">Cancel</button>
        <div class="share-header-title" data-i18n="shareToFeedTitle">Share to Feed</div>
        <button class="share-header-post" id="postBtn" onclick="submitPost()" disabled data-i18n="post">Post</button>
    </div>

    <div class="share-body">
        <div class="share-card">
            <div class="share-card-title" data-i18n="shareAnything">Share anything</div>
            <textarea id="thoughtsInput" class="share-textarea" rows="9"
                placeholder="A cultural wow moment, a reflection, something that inspired you, a word you learned…"
                data-i18n-placeholder="shareAnythingPlaceholder" oninput="onComposeChange()"></textarea>
        </div>

        <div class="share-card" id="sessionPickerCard">
            <div class="share-card-title-row">
                <div class="share-card-title" data-i18n="attachSession">Attach a past session</div>
                <div class="share-card-subtitle" data-i18n="optional">Optional</div>
            </div>

            <button type="button" class="share-session-trigger" id="sessionTrigger" onclick="openSessionPicker()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span data-i18n="chooseSession">Choose a session</span>
            </button>

            <div class="share-session-chip" id="sessionChip" hidden onclick="openSessionPicker()">
                <div class="share-session-chip-thumb">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <div class="share-session-chip-text">
                    <div class="share-session-chip-title" id="sessionChipTitle"></div>
                    <div class="share-session-chip-date" id="sessionChipDate"></div>
                </div>
                <button type="button" class="share-session-chip-remove" onclick="event.stopPropagation(); clearSelectedSession()" aria-label="Remove session">×</button>
            </div>
        </div>

        <div class="session-sheet-overlay" id="sessionSheetOverlay" hidden onclick="if(event.target===this) closeSessionPicker()">
            <div class="session-sheet">
                <div class="session-sheet-handle"></div>
                <div class="session-sheet-header">
                    <div class="session-sheet-title" data-i18n="yourPastSessions">Your past sessions</div>
                    <button type="button" class="session-sheet-close" onclick="closeSessionPicker()" aria-label="Close">×</button>
                </div>
                <div class="session-sheet-list" id="sessionList"></div>
            </div>
        </div>

        <div class="share-card">
            <div class="share-card-title-row">
                <div class="share-card-title" data-i18n="photos">Photos</div>
                <div class="share-card-subtitle" data-i18n="photosOptional">Optional · up to 10</div>
            </div>
            <div class="share-photo-grid" id="photoGrid">
                <label class="share-photo-add" id="photoAddTile">
                    <input type="file" accept="image/*" id="photoInput" multiple hidden onchange="onPhotosSelected(event)">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    <span data-i18n="add">Add</span>
                </label>
            </div>
        </div>

        <div id="composeError" class="share-error" hidden></div>
    </div>

    <script src="js/share-to-feed.js?v=20260929"></script>
</body>

</html>
