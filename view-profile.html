<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="assets/logos/lingping_logo.png">
    <meta charset="UTF-8">
    <title>View Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="config.js"></script>
    <link rel="stylesheet" href="assets/event-detail_style.css?v=20260529">
    <link rel="icon" type="image/png" href="assets/logos/lingping_logo.png">
    <style>
        :root {
            --theme: #FFB050;
            --progress-fill: #90C2C8;
            --badge-bg: #FFE8D6;
        }

        body {
            background: linear-gradient(180deg, rgba(255, 176, 80, 0.18), #f5f5f5 220px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .back-btn {
            margin-bottom: 14px;
            font-size: 14px;
            color: var(--theme);
            cursor: pointer;
            font-weight: 500;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .profile-card {
            background: #fff;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
        }

        /* ─── RESPONSIVE LAYOUT ─── */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12%;
        }

        @media (min-width: 768px) {
            .layout-wrapper {
                flex-direction: row;
                align-items: flex-start;
                padding: 40px;
            }

            .left-col {
                width: 300px;
                flex-shrink: 0;
            }

            .right-col {
                flex-grow: 1;
            }

            .profile-section:first-child {
                margin-top: 0;
            }
        }

        /* ─── LEFT COLUMN (STATS & AVATAR) ─── */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-header img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
            margin-bottom: 14px;
            cursor: zoom-in;
        }

        .profile-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }

        .user-badge {
            display: inline-block;
            background: var(--badge-bg);
            color: #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }

        .stats-container {
            margin-top: 24px;
        }

        .stat-group {
            margin-bottom: 18px;
        }

        .stat-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #222;
        }

        .progress-bar-bg {
            background: #E8E8E8;
            border-radius: 8px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            background: var(--progress-fill);
            height: 100%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .stat-detail {
            font-size: 13px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }

        .stat-detail strong {
            color: #222;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #444;
            margin-top: 14px;
        }

        /* ─── RIGHT COLUMN (ABOUT & FUN FACTS) ─── */
        .profile-section {
            margin-top: 28px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 14px;
        }

        .profile-description {
            color: #444;
            font-size: 16px;
            line-height: 1.6;
        }

        .topic {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 176, 80, 0.15);
            color: #333;
            font-size: 13px;
            font-weight: 500;
            margin: 6px 6px 0 0;
            border: 1px solid rgba(255, 176, 80, 0.4);
        }

        .fun-prompt {
            background: #fff;
            border: 1px solid #eaeaea;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .fun-prompt strong {
            font-weight: 600;
            color: #222;
        }

        .fun-answer {
            margin-top: 8px;
            color: #555;
            white-space: pre-line;
            line-height: 1.5;
            font-size: 16px;
        }

        /* ─── IMAGE MODAL ─── */
        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .image-modal.show {
            display: flex;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 8px;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 14px;
        }

        /* Base Matte Stamp Badge */
        .user-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            width: 200px;
            height: 48px;
            padding: 0 16px;
            box-sizing: border-box;

            background: #FFFFFF;
            border-radius: 16px;
            border-width: 2px;
            border-style: solid;

            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.1px;

            /* Matte look: No shiny gradients or heavy shadows */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: transform 0.15s ease;
        }

        .user-badge:hover {
            transform: translateY(-1px);
        }

        .user-badge span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-laurel-svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        /* 🎨 Matte Color Themes (Matching the Stamp Palette) */

        /* Theme 1: Matte Ocher / Amber Warm */
        .badge-theme-1 {
            border-color: #C88A2B;
            color: #A36B18;
            background-color: #FFFDF8;
        }

        /* Theme 2: Matte Coral / Red */
        .badge-theme-2 {
            border-color: #FF5A5F;
            color: #E03E43;
            background-color: #FFF8F8;
        }

        /* Theme 3: Matte Sky / Air Blue */
        .badge-theme-3 {
            border-color: #3C82C8;
            color: #2A68A8;
            background-color: #F8FBFF;
        }

        .profile-card {
            position: relative;
            /* Needed to anchor the top-right edit button */
        }

        .edit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFFFFF;
            border: 1px solid #E2E2E2;
            color: #333333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .edit-btn:hover {
            background: #F8F8F8;
            border-color: #CCCCCC;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="back-btn" onclick="history.back()">← Back</div>
        <div id="profileContent">Loading profile...</div>
    </div>

    <script>
        const { BASE_URL, API_KEY } = window.CONFIG;
        const userId = localStorage.getItem("viewUserId");
        const container = document.getElementById("profileContent");


        if (!userId) {
            container.innerHTML = "<p>User not found.</p>";
        } else {
            loadProfile();
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${BASE_URL}/users/${userId}/profile`, {
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-KEY": API_KEY
                    }
                });

                if (res.status === 404) {
                    container.innerHTML = `
            <div class="profile-card">
                <h2>Profile not available</h2>
                <p class="sub">This member hasn’t created a public profile yet.</p>
                <p class="sub">You can still see them in sessions and activities 😊</p>
            </div>`;
                    return;
                }

                const json = await res.json();
                const p = json.data;
                const pi = p.progressInfo || {}; // Fallback for safety

                // Check if user is viewing their own profile
                const myUserId = localStorage.getItem("userId") || localStorage.getItem("currentUserId");
                const viewUserId = localStorage.getItem("viewUserId");
                const isOwnProfile = myUserId && viewUserId && myUserId === viewUserId;

                // Safe avatar string to prevent inline onclick quote breaking
                const avatarSrc = p.profilePic || 'https://via.placeholder.com/140';

                // Determine if valid progress data exists
                const hasProgress = pi.host && pi.learn;

                container.innerHTML = `
            <div class="profile-card layout-wrapper">
                
                <!-- Top-Right Edit Button (Renders only on your own profile) -->
                ${isOwnProfile ? `
                    <a href="community-profile.html" class="edit-btn">
                        ✏️ Edit
                    </a>
                ` : ''}

                <!-- LEFT COLUMN: Avatar & Gamification Stats -->
                <div class="left-col">
                    <div class="profile-header">
                        <img
                            src="${avatarSrc}"
                            alt="${p.displayName}"
                            onclick="openImageModal('${avatarSrc}')"
                        >
                        <h2>${p.displayName}</h2>
                        
                        ${(pi.badges && pi.badges.length) ? `
                            <div class="badges-container">
                                ${pi.badges.map((badge, idx) => `
                                    <div class="user-badge badge-theme-${(idx % 3) + 1}">
                                        <svg class="badge-laurel-svg" viewBox="0 0 200 200">
                                            <defs>
                                                <g id="laurel-branch">
                                                    <path d="M 90 175 A 75 75 0 0 1 35 65" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
                                                    <path d="M 35 65 C 30 50 40 35 48 30 C 52 42 45 58 35 65 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 38 72 C 22 66 12 52 20 42 C 32 48 35 62 38 72 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 40 76 C 54 66 68 70 68 82 C 55 86 44 80 40 76 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 30 92 C 12 90 2 78 10 67 C 22 71 27 83 30 92 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 33 97 C 49 90 62 96 60 108 C 48 111 38 103 33 97 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 28 116 C 10 118 2 106 12 94 C 23 98 26 108 28 116 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 33 121 C 49 117 60 125 56 137 C 44 138 36 128 33 121 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 36 140 C 20 148 10 138 20 124 C 31 126 33 134 36 140 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 43 144 C 58 144 67 154 61 165 C 50 164 44 152 43 144 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 52 161 C 38 172 26 164 34 149 C 45 150 49 157 52 161 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                    <path d="M 60 163 C 74 167 81 179 73 189 C 63 186 59 173 60 163 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
                                                </g>
                                            </defs>
                                            <use href="#laurel-branch" />
                                            <use href="#laurel-branch" transform="translate(200, 0) scale(-1, 1)" />
                                        </svg>
                                        <span>${badge}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>

                    ${hasProgress ? `
                    <div class="stats-container">
                        <!-- Host Progress -->
                        <div class="stat-group">
                            <div class="stat-title">🎙️ Host Progress <span>(${pi.host.currentPoints} points)</span></div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${pi.host.progressPercentage}%"></div>
                            </div>
                            <div class="stat-detail">
                                <span>Lvl ${pi.host.level} • ${pi.host.badgeName || pi.host.badge || 'No Hosting Activity'}</span>
                                <strong>${pi.host.currentPoints} / ${pi.host.maxPoints} pts</strong>
                            </div>
                        </div>

                        <!-- Learn Progress -->
                        <div class="stat-group">
                            <div class="stat-title">📚 Learn Progress <span>(${pi.learn.currentPoints} points)</span></div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${pi.learn.progressPercentage}%"></div>
                            </div>
                            <div class="stat-detail">
                                <span>Lvl ${pi.learn.level} • ${pi.learn.badgeName || pi.learn.badge}</span>
                                <strong>${pi.learn.currentPoints} / ${pi.learn.maxPoints} pts</strong>
                            </div>
                        </div>

                        <!-- Metadata Rows -->
                        ${pi.membershipTenure ? `<div class="info-row">📅 ${pi.membershipTenure.displayText}</div>` : ''}
                    </div>
                    ` : ''}
                </div>

                <!-- RIGHT COLUMN: About & Fun Facts -->
                <div class="right-col">
                    ${p.description && p.description.trim() ? `
                    <div class="profile-section">
                        <div class="section-title">About ${p.displayName}</div>
                        <div class="profile-description">${p.description}</div>
                    </div>
                    ` : ""}

                    ${p.topicsOfInterests && p.topicsOfInterests.length ? `
                    <div class="profile-section">
                        <div class="section-title">Topics of Interest</div>
                        <div>
                            ${p.topicsOfInterests.map(t => `<span class="topic">${t.name}</span>`).join("")}
                        </div>
                    </div>
                    ` : ""}

                    ${(p.funPrompts || []).filter(fp => fp.answer && fp.answer.trim()).length ? `
                    <div class="profile-section">
                        <div class="section-title">Fun Facts</div>
                        ${(p.funPrompts || []).filter(fp => fp.answer && fp.answer.trim()).map(fp => `
                            <div class="fun-prompt">
                                <strong>${fp.question}</strong>
                                <div class="fun-answer">${fp.answer}</div>
                            </div>
                        `).join("")}
                    </div>
                    ` : ""}
                </div>

            </div>

            <!-- Image Modal -->
            <div id="imageModal" class="image-modal" onclick="closeImageModal()">
                <span class="close-btn">&times;</span>
                <img id="modalImage" class="modal-image">
            </div>
        `;
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p>Failed to load profile.</p>";
            }
        }

        // Modal scripts
        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImage').src = src;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        document.addEventListener('click', function (e) {
            if (e.target.id === 'modalImage') e.stopPropagation();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeImageModal();
        });
    </script>
</body>

</html>
